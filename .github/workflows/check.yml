name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-vendor from pinned commits
        run: python tools/sync.py
      - name: Vendored files must match pinned commits
        run: |
          if ! git diff --exit-code; then
            echo "::error::Vendored files differ from the pinned commits. Run python tools/sync.py and commit the result."
            exit 1
          fi
      - name: Checks
        run: python tools/check.py